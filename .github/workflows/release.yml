name: Source patch release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*-custom.*'

permissions:
  contents: read

concurrency:
  group: source-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checksums, pinned upstream base, patch summary, and resulting source tree
        run: bash scripts/verify-release.sh
      - name: Read pinned Bun version
        id: runtime
        shell: bash
        run: |
          bun_version="$(jq -er '.requiredBunVersion' manifest.json)"
          [[ "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "bun_version=$bun_version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.runtime.outputs.bun_version }}
      - name: Materialize the verified patched source
        shell: bash
        run: |
          patched_source="$RUNNER_TEMP/patched-source"
          base_commit="$(jq -er '.baseCommit' manifest.json)"
          patch_name="$(jq -er '.patch' manifest.json)"
          expected_tree="$(jq -er '.sourceTree' manifest.json)"
          git worktree add --detach "$patched_source" "$base_commit"
          git -C "$patched_source" apply --index --binary "$GITHUB_WORKSPACE/$patch_name"
          [[ "$(git -C "$patched_source" write-tree)" == "$expected_tree" ]]
          [[ "$(bun --version)" == "${{ steps.runtime.outputs.bun_version }}" ]]
      - name: Install exact root and launcher dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/patched-source
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
      - name: Verify patched source audits, types, tests, builds, and runtime smoke
        shell: bash
        working-directory: ${{ runner.temp }}/patched-source
        run: bun run verify

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and assemble source-patch bundle
        id: package
        run: |
          bash scripts/verify-release.sh
          release_name="$(jq -r '.release' manifest.json)"
          patch_name="$(jq -r '.patch' manifest.json)"
          release_dir="$RUNNER_TEMP/$release_name"
          asset_zip="$RUNNER_TEMP/$release_name-source-patch.zip"
          mkdir -p "$release_dir/scripts"
          cp README.md RELEASE_NOTES.md LICENSE-upstream.txt manifest.json SHA256SUMS.txt "$release_dir/"
          cp "$patch_name" "$release_dir/"
          cp scripts/apply.ps1 scripts/verify.ps1 scripts/verify-release.sh "$release_dir/scripts/"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          find "$release_dir" -exec touch -d "@$source_date_epoch" {} +
          (
            cd "$RUNNER_TEMP"
            LC_ALL=C find "$release_name" -type f -print | LC_ALL=C sort | zip -X -q "$asset_zip" -@
          )
          echo "asset_zip=$asset_zip" >> "$GITHUB_OUTPUT"
      - name: Publish verified GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ZIP: ${{ steps.package.outputs.asset_zip }}
        run: |
          release_name="$(jq -r '.release' manifest.json)"
          patch_name="$(jq -r '.patch' manifest.json)"
          release_files=("$ASSET_ZIP" "$patch_name" manifest.json SHA256SUMS.txt)

          local_file_for() {
            local wanted="$1"
            local file
            for file in "${release_files[@]}"; do
              if [[ "$(basename "$file")" == "$wanted" ]]; then
                printf '%s\n' "$file"
                return 0
              fi
            done
            return 1
          }

          verify_complete_assets() {
            local destination="$1"
            local file name
            mapfile -t remote_names < <(gh release view "$release_name" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')
            [[ "${#remote_names[@]}" -eq "${#release_files[@]}" ]] || {
              echo "Release has an unexpected asset inventory" >&2
              exit 1
            }
            mkdir -p "$destination"
            gh release download "$release_name" --repo "$GITHUB_REPOSITORY" --dir "$destination"
            for file in "${release_files[@]}"; do
              name="$(basename "$file")"
              [[ -f "$destination/$name" ]] || {
                echo "Release asset $name is missing" >&2
                exit 1
              }
              cmp -s "$file" "$destination/$name" || {
                echo "Release asset $name differs from the assembled artifact" >&2
                exit 1
              }
            done
          }

          assert_published_immutable() {
            local immutable
            immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_name" --jq '.immutable')"
            [[ "$immutable" == "true" ]] || {
              echo "Published release $release_name is mutable. Enable repository-level release immutability before publishing release tags." >&2
              exit 1
            }
          }

          if gh release view "$release_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$release_name" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')"
            mapfile -t remote_names < <(gh release view "$release_name" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')

            existing_dir="$RUNNER_TEMP/existing-$release_name"
            mkdir -p "$existing_dir"
            if [[ "${#remote_names[@]}" -gt 0 ]]; then
              gh release download "$release_name" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir"
            fi
            for name in "${remote_names[@]}"; do
              local_file="$(local_file_for "$name")" || {
                echo "Existing release contains unexpected asset $name" >&2
                exit 1
              }
              cmp -s "$local_file" "$existing_dir/$name" || {
                echo "Existing release asset $name differs from the assembled artifact" >&2
                exit 1
              }
            done

            if [[ "$is_draft" == "true" ]]; then
              for file in "${release_files[@]}"; do
                name="$(basename "$file")"
                found=false
                for remote_name in "${remote_names[@]}"; do
                  if [[ "$remote_name" == "$name" ]]; then
                    found=true
                    break
                  fi
                done
                if [[ "$found" == "false" ]]; then
                  gh release upload "$release_name" --repo "$GITHUB_REPOSITORY" "$file"
                fi
              done

              verify_complete_assets "$RUNNER_TEMP/ready-$release_name"
              gh release edit "$release_name" --repo "$GITHUB_REPOSITORY" --draft=false
              assert_published_immutable
              echo "Recovered and published draft release $release_name with exact immutable assets"
              exit 0
            fi

            verify_complete_assets "$RUNNER_TEMP/verified-$release_name"
            assert_published_immutable
            echo "Release $release_name already exists with the exact expected assets; leaving it unchanged"
            exit 0
          fi

          gh release create "$release_name" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Codex ChatGPT Web $release_name — custom source patch" \
            --notes-file RELEASE_NOTES.md

          gh release upload "$release_name" \
            --repo "$GITHUB_REPOSITORY" \
            "${release_files[@]}"

          verify_complete_assets "$RUNNER_TEMP/published-$release_name"
          gh release edit "$release_name" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          assert_published_immutable
